services:
  db:
    image: postgres:17
    container_name: gomez-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5435:5432"
    environment:
      POSTGRES_USER: gomez
      POSTGRES_PASSWORD: gomez
      POSTGRES_DB: gomez
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gomez -d gomez"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  db-data:
